# UniSmart Pay - Apache site (HTTPS, port 443)
# Install: sudo cp deploy/apache/unismartpay-ssl.conf /etc/apache2/sites-available/
#          sudo a2enmod ssl && sudo a2ensite unismartpay-ssl && sudo systemctl reload apache2

<VirtualHost *:443>
    ServerName pay.example.edu

    DocumentRoot /var/www/unismartpay

    <Directory /var/www/unismartpay>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RedirectMatch 302 ^/$ /UniSmartPay/web/

    SSLEngine on
    # Let's Encrypt paths shown; use your university's certificate files instead if needed.
    SSLCertificateFile    /etc/letsencrypt/live/pay.example.edu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pay.example.edu/privkey.pem

    # Browsers remember to use HTTPS for a year. The ESP32 terminals are not
    # affected: they don't apply HSTS.
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/unismartpay-error.log
    CustomLog ${APACHE_LOG_DIR}/unismartpay-access.log combined
</VirtualHost>
