# UniSmart Pay - Apache site (HTTP, port 80)
# Install: sudo cp deploy/apache/unismartpay.conf /etc/apache2/sites-available/
#          sudo a2ensite unismartpay && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName pay.example.edu

    # Contains only UniSmartPay/web and UniSmartPay/assets (symlinks into
    # /opt/unismartpay). The rest of the repository is never served.
    DocumentRoot /var/www/unismartpay

    <Directory /var/www/unismartpay>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RedirectMatch 302 ^/$ /UniSmartPay/web/

    # After HTTPS works (unismartpay-ssl.conf), uncomment these lines to send
    # browsers to HTTPS. The terminal API stays on HTTP because the ESP32
    # firmware does not support HTTPS yet.
    #RewriteEngine On
    #RewriteCond %{REQUEST_URI} !^/UniSmartPay/web/api/
    #RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/unismartpay-error.log
    CustomLog ${APACHE_LOG_DIR}/unismartpay-access.log combined
</VirtualHost>
